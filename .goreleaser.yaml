version: 2

project_name: easy

before:
  hooks:
    - go mod tidy

builds:
  - id: easy
    main: ./cmd/easy
    binary: easy
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X easy-cli/internal/version.Version={{.Version}}
      - -X easy-cli/internal/version.Commit={{.ShortCommit}}
      - -X easy-cli/internal/version.Date={{.Date}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  draft: false
  prerelease: auto
