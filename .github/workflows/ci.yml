name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version: "1.24.x"
          cache: true

      - name: gofmt
        run: test -z "$(gofmt -l cmd internal)"

      - name: go vet
        run: go vet ./...

      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          args: --timeout=3m

      - name: unit tests
        run: go test ./...

      - name: integration tests
        run: go test -tags=integration -count=1 ./...

      - name: go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
